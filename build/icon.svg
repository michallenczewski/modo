<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Ikona Modo „Wypychanie” (wariant B2, wybór Michała 28.11.2026; makieta/ikona.html): płyta i gruba strzałka w górę,
       jak narzędzie Wypchnij. Jedno źródło dla obu systemów, według wytycznych ikon rodziny (../rodzina/ikony/WYTYCZNE_IKONY.md):
       tło rx 36 (Windows 230 z 1024, Mac 185 z 824), znak w polu 24–133, bez cienia.
       PNG robi scripts/ikona.js: build/icon-win.png (Windows, na całe płótno) i build/icon.png (Mac, 824 px na 1024 z marginesem 100). -->
  <rect width="160" height="160" rx="36" fill="#C6F432"/>
  <g stroke="#161616" stroke-width="9" stroke-linejoin="round">
    <polygon points="80,79 120,101 80,123 40,101" fill="#FFFFFF"/>
    <polygon points="40,101 80,123 80,128 40,106" fill="#161616"/>
    <polygon points="80,123 120,101 120,106 80,128" fill="#FFFFFF"/>
  </g>
  <path d="M80 97 V31 M58 53 L80 31 L102 53" stroke="#161616" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
